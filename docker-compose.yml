services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: harmony
      POSTGRES_USER: harmony
      POSTGRES_PASSWORD: harmony
    volumes:
      - harmony_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harmony"]
      interval: 3s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    environment:
      APP_ENVIRONMENT: demo
      DEMO_RESET_ENABLED: true
      DATABASE_URL: postgresql+psycopg://harmony:harmony@db:5432/harmony
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: gemma3:4b
      OLLAMA_TIMEOUT_SECONDS: 25
      OLLAMA_HEALTH_TIMEOUT_SECONDS: 1
      OLLAMA_UNAVAILABLE_CACHE_SECONDS: 10
      OLLAMA_FAILURE_CACHE_SECONDS: 30
      OLLAMA_MAX_OUTPUT_TOKENS: 64
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  harmony_data:
